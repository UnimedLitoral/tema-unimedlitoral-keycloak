# Tema de login Unimed Litoral
# Herda os templates do tema "keycloak" (que herda de "base") e substitui
# todo o visual: o PatternFly do tema pai NÃO é carregado (stylesCommon vazio).
parent=keycloak
import=common/keycloak

stylesCommon=
styles=css/unimed.css
scripts=

meta=viewport==width=device-width,initial-scale=1 theme-color==#00995D

locales=pt-BR,en

# ---------------------------------------------------------------
# Personalização (opcional)
# Link exibido no rodapé do login ("Conheça nossos planos").
# Deixe vazio para esconder.
unimedPlansUrl=
# Texto auxiliar abaixo do título da tela de login.
# (o texto vem de messages: loginSubtitle)
# ---------------------------------------------------------------

